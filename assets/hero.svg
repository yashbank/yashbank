<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yash Bankar, AI-native product engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".5" stop-color="#1b1146"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#38bdf8;#a78bfa;#f472b6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#f472b6" stop-opacity=".5"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle r="190" fill="url(#o1)"><animateMotion dur="14s" repeatCount="indefinite" path="M180,80 C420,260 760,0 980,200 C760,40 420,300 180,80Z"/></circle>
    <circle r="210" fill="url(#o2)"><animateMotion dur="18s" repeatCount="indefinite" path="M900,60 C700,300 380,40 220,240 C420,0 700,280 900,60Z"/></circle>
    <circle r="160" fill="url(#o3)"><animateMotion dur="22s" repeatCount="indefinite" path="M600,280 C800,40 1000,300 1100,120 C900,260 760,0 600,280Z"/></circle>
    <g fill="none" stroke="#ffffff" stroke-opacity=".12">
      <circle cx="1010" cy="160" r="90"><animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="30s" repeatCount="indefinite"/></circle>
      <ellipse cx="1010" cy="160" rx="130" ry="46"><animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="-360 1010 160" dur="24s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="#fff">
      <circle cx="1100" cy="160" r="5" fill="#38bdf8"><animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="70" r="4" fill="#f472b6"><animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="-360 1010 160" dur="13s" repeatCount="indefinite"/></circle>
    </g>
    <text x="70" y="150" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#txt)">Yash Bankar</text>
    <text x="74" y="205" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#e2e8f0" fill-opacity=".92">AI-native product engineer · full-stack · automation</text>
    <text x="74" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#94a3b8">ship fast  ·  secure by default  ·  built to be used<tspan fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> ▍</tspan></text>
  </g>
</svg>
